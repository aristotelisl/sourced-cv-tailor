projects:
  - id: flowboard
    name: FlowBoard (MSc Dissertation)
    context: Industry project with Orbitale
    url: null
    year: 2026
    stack:
      frontend: [React 19, TypeScript, Vite, Zustand, Tailwind CSS, shadcn/ui, React Flow, d3-force]
      backend: [Python, Flask, Pydantic, NetworkX, OpenAI API]
      infra: [Docker, Docker Compose]
    facts:
      - id: fb_overview
        text: Turns written requirements documents into editable process diagrams
      - id: fb_agents
        text: Four LLM agents (summarise, extract steps, link steps, validate), each behind its own Flask endpoint
      - id: fb_structured_outputs
        text: Structured outputs via OpenAI structured parsing + Pydantic models
      - id: fb_hitl
        text: Human-in-the-loop mode (pause for review at each step) or fully automated mode
      - id: fb_validation
        text: Deterministic graph validation in NetworkX (orphan steps, dead ends, unknown references) combined with LLM review
      - id: fb_editor
        text: React Flow editor; drag-to-connect creates links; click to edit steps and links
      - id: fb_layout
        text: d3-force auto-layout; existing steps pinned so edits never reshuffle the layout
      - id: fb_store
        text: Single Zustand store as source of truth; renames and deletes cascade; diagram re-derived on the client with no API call
      - id: fb_cycles
        text: Client-side cycle detection (DFS) highlights loops in the process
      - id: fb_exports
        text: Exports to PNG and standalone HTML; JSON save/load with validation
    unconfirmed:
