# How the app tailors for you. Every key is optional; leave one out to skip that check.
preferences:
  home_places: [Portugal, Porto, Lisbon, Braga]   # on-site/hybrid elsewhere is flagged
  work_rights:                                    # right-to-work requirements elsewhere are flagged
    - {label: the UK (pre-settled), places: [uk]} # "uk" and "eu" are built-in regions; or list places
    - {label: the EU, places: [eu]}
  home_currencies: [EUR, GBP, CHF, SEK, NOK, DKK, PLN, CZK, HUF, RON, BGN, ISK]   # other salary currencies are flagged
  header_suggestions:                             # suggest a person.header_extras line for jobs in these places
    - extra: uk_presettled
      when_job_in: [uk]
      reason: 'UK role: shows you can work in the UK without sponsorship'
  sign_off: "Kind regards,\nJordan"
  tailoring_notes: |
    | Role family | Section order | Lead with |
    |---|---|---|
    | frontend / fullstack | Employment, Education, Project, Awards, Skills | Next.js work, the flow builder, the React Flow editor |
    | graduate / new-grad | Education first | Degree, then experience |
    | backend / ai-engineer | Employment first | Python microservices, RAG pipelines, APIs (ASP.NET, Flask) |
    - Always keep the MSc dissertation (flowboard) as the Selected Project.
